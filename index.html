<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn photos into editable mesh gradients and export them as PNGs.">
  <title>Image to Mesh Gradient</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=4">
  <script defer src="gradient.js?v=4"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8" r="1.5"/><path d="m3 17 4-4 3 3 5-6 6 6"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 4v5h-5M4 20v-5h5M5 9a7 7 0 0 1 12-3l3 3M4 15l3 3a7 7 0 0 0 12-3"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
  </svg>
  <main class="workspace">
    <div class="preview-stage">
      <div class="preview" id="preview">
        <canvas id="gradient" role="img" aria-label="Live gradient and grid preview"></canvas>
        <canvas id="grid-preview" aria-hidden="true"></canvas>
        <div class="color-points" id="color-points" role="group" aria-label="Gradient color points. Use arrow keys to move a point."></div>
        <span class="drop-hint" aria-hidden="true">Drop an image to extract its colors</span>
      </div>
    </div>

    <aside class="sidebar" aria-label="Canvas controls">
      <details class="panel" name="canvas-panel" open>
        <summary class="panel-heading">Gradient<svg aria-hidden="true"><use href="#chevron"/></svg></summary>
        <div class="settings">
          <label class="setting">
            <strong>Gradient</strong>
            <span class="select">
              <select id="style" aria-label="Gradient Style">
                <option>Sharp Bézier</option><option>Soft Bézier</option><option>Mesh Static</option>
                <option>Mesh Grid</option><option>Simple</option>
              </select>
              <svg><use href="#chevron"/></svg>
            </span>
          </label>
          <label class="setting">
            <strong>Warp Shape</strong>
            <span class="select">
              <select id="shape">
                <option>Simplex Noise</option><option>Circular</option><option>Value Noise</option>
                <option>Worley Noise</option><option>FBM Noise</option><option>Voronoi Noise</option>
                <option>Domain Warping</option><option selected>Waves</option><option>Smooth Noise</option>
                <option>Oval</option><option>Rows</option><option>Columns</option><option>Flat</option><option>Gravity</option>
              </select>
              <svg><use href="#chevron"/></svg>
            </span>
          </label>
          <div class="dimensions">
            <label><strong>W</strong><input id="width" aria-label="Width in pixels" type="number" min="1" max="4096" value="648"></label>
            <label><strong>H</strong><input id="height" aria-label="Height in pixels" type="number" min="1" max="4096" value="648"></label>
          </div>
        </div>

        <div class="sliders">
          <label>Warp<input id="warp" type="range" min="0" max="1.5" value="0.4" step="0.01"></label>
          <label>Warp Size<input id="size" type="range" min="0" max="3" value="1" step="0.01"></label>
          <label>Noise<input id="noise" type="range" min="0" max="0.15" value="0.08" step="0.001"></label>
        </div>

        <div class="palette">
          <div class="palette-heading">
            <strong>Colors</strong>
            <div class="actions">
              <button id="import" class="icon" title="Extract colors from an image" aria-label="Extract colors from an image"><svg><use href="#photo"/></svg></button>
              <button id="shuffle" class="icon" title="Shuffle colors" aria-label="Shuffle colors"><svg><use href="#refresh"/></svg></button>
              <button id="add" class="icon" title="Add color" aria-label="Add color"><svg><use href="#plus"/></svg></button>
            </div>
          </div>
          <input id="photo-input" type="file" accept="image/*" hidden>
          <ul id="colors"></ul>
        </div>
      </details>

      <details class="panel" name="canvas-panel">
        <summary class="panel-heading">Grid<svg aria-hidden="true"><use href="#chevron"/></svg></summary>
        <div class="grid-settings">
          <label class="setting">
            <strong>Grid Layout</strong>
            <span class="select">
              <select id="grid-mode">
                <option value="off">Off</option>
                <option value="borderless">Borderless</option>
                <option value="bordered">Bordered</option>
              </select>
              <svg aria-hidden="true"><use href="#chevron"/></svg>
            </span>
          </label>
          <fieldset id="grid-controls" disabled aria-label="Grid settings">
            <div class="grid-setting"><label for="grid-color">Grid Color</label>
              <span class="grid-color">
                <button class="swatch" id="grid-color-picker" type="button" aria-label="Pick grid color" aria-haspopup="dialog" aria-expanded="false" popovertarget="color-picker"></button>
                <input class="hex" id="grid-color" value="FFFFFF" maxlength="7" spellcheck="false" aria-label="Grid color hex">
              </span>
            </div>
            <label class="grid-setting">Grid Size
              <input id="grid-size" type="range" min="12" max="256" value="48">
              <output for="grid-size">48 px</output>
            </label>
            <label class="grid-setting">Grid Thickness
              <input id="grid-thickness" type="range" min="0.5" max="16" step="0.5" value="1">
              <output for="grid-thickness">1 px</output>
            </label>
            <fieldset id="grid-border-controls" disabled hidden aria-label="Border settings">
              <label class="grid-setting">Border Padding
                <input id="grid-padding" type="range" min="0" max="192" value="24">
                <output for="grid-padding">24 px</output>
              </label>
              <label class="grid-setting">Border Thickness
                <input id="grid-border-thickness" type="range" min="0.5" max="24" step="0.5" value="2">
                <output for="grid-border-thickness">2 px</output>
              </label>
            </fieldset>
            <label class="setting grid-toggle">Intersection Dots
              <input id="grid-dots" type="checkbox">
            </label>
            <fieldset id="grid-dot-controls" disabled hidden aria-label="Dot settings">
              <div class="grid-setting"><label for="grid-dot-color">Dot Color</label>
                <span class="grid-color">
                  <button class="swatch" id="grid-dot-color-picker" type="button" aria-label="Pick dot color" aria-haspopup="dialog" aria-expanded="false" popovertarget="color-picker"></button>
                  <input class="hex" id="grid-dot-color" value="FFFFFF" maxlength="7" spellcheck="false" aria-label="Dot color hex">
                </span>
              </div>
              <label class="grid-setting">Dot Diameter
                <input id="grid-dot-size" type="range" min="1" max="32" step="0.5" value="4">
                <output for="grid-dot-size">4 px</output>
              </label>
            </fieldset>
          </fieldset>
        </div>
      </details>

      <div class="panel">
        <button class="download" id="download"><svg><use href="#download-icon"/></svg>Download</button>
        <p id="status" role="status" hidden></p>
      </div>
    </aside>
    <div id="color-picker" popover role="dialog" aria-label="Color picker">
      <div id="picker-square" tabindex="0" autofocus role="slider"
        aria-label="Saturation and brightness. Use left and right for saturation, up and down for brightness."
        aria-valuemin="0" aria-valuemax="100">
        <span id="picker-marker" aria-hidden="true"></span>
      </div>
      <input id="picker-hue" type="range" min="0" max="359" step="1" aria-label="Hue">
    </div>
  </main>

  <footer>
    <span class="brand"><img src="icon.svg" width="24" height="24" alt="">Photo Gradient</span>
    <a href="https://www.figma.com/community/plugin/1438020299097238961/photo-gradient">Try the Figma Plugin</a>
    <span><a href="https://x.com/daniel__designs">Made by Daniel</a> © 2024</span>
  </footer>
</body>
</html>
