<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn photos into editable mesh gradients and export them as PNGs.">
  <title>Image to Mesh Gradient</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="gradient.js"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="photo" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8" r="1.5"/><path d="m3 17 4-4 3 3 5-6 6 6"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 4v5h-5M4 20v-5h5M5 9a7 7 0 0 1 12-3l3 3M4 15l3 3a7 7 0 0 0 12-3"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
  </svg>
  <main class="workspace">
    <div class="preview-stage">
      <div class="preview" id="preview">
        <canvas id="gradient" role="img" aria-label="Live mesh gradient preview"></canvas>
        <div class="color-points" id="color-points" role="group" aria-label="Gradient color points. Use arrow keys to move a point."></div>
        <span class="drop-hint" aria-hidden="true">Drop an image to extract its colors</span>
      </div>
    </div>

    <section class="panel" aria-label="Gradient editor">
      <div class="settings">
        <label class="setting">
          <strong>Gradient</strong>
          <span class="select">
            <select id="style" aria-label="Gradient Style">
              <option>Sharp Bézier</option><option>Soft Bézier</option><option>Mesh Static</option>
              <option>Mesh Grid</option><option>Simple</option>
            </select>
            <svg><use href="#chevron"/></svg>
          </span>
        </label>
        <label class="setting">
          <strong>Warp Shape</strong>
          <span class="select">
            <select id="shape">
              <option>Simplex Noise</option><option>Circular</option><option>Value Noise</option>
              <option>Worley Noise</option><option>FBM Noise</option><option>Voronoi Noise</option>
              <option>Domain Warping</option><option selected>Waves</option><option>Smooth Noise</option>
              <option>Oval</option><option>Rows</option><option>Columns</option><option>Flat</option><option>Gravity</option>
            </select>
            <svg><use href="#chevron"/></svg>
          </span>
        </label>
        <div class="dimensions">
          <label><strong>W</strong><input id="width" aria-label="Width in pixels" type="number" min="1" max="4096" value="648"></label>
          <label><strong>H</strong><input id="height" aria-label="Height in pixels" type="number" min="1" max="4096" value="648"></label>
        </div>
      </div>

      <div class="sliders">
        <label>Warp<input id="warp" type="range" min="0" max="1.5" value="0.4" step="0.01"></label>
        <label>Warp Size<input id="size" type="range" min="0" max="3" value="1" step="0.01"></label>
        <label>Noise<input id="noise" type="range" min="0" max="0.15" value="0.08" step="0.001"></label>
      </div>

      <div class="palette">
        <div class="palette-heading">
          <strong>Colors</strong>
          <div class="actions">
            <button id="import" class="icon" title="Extract colors from an image" aria-label="Extract colors from an image"><svg><use href="#photo"/></svg></button>
            <button id="shuffle" class="icon" title="Shuffle colors" aria-label="Shuffle colors"><svg><use href="#refresh"/></svg></button>
            <button id="add" class="icon" title="Add color" aria-label="Add color"><svg><use href="#plus"/></svg></button>
          </div>
        </div>
        <input id="photo-input" type="file" accept="image/*" hidden>
        <ul id="colors"></ul>
        <p id="status" role="status" hidden></p>
      </div>

      <button class="download" id="download"><svg><use href="#download-icon"/></svg>Download</button>
    </section>
  </main>

  <footer>
    <span class="brand"><img src="icon.svg" width="24" height="24" alt="">Photo Gradient</span>
    <a href="https://www.figma.com/community/plugin/1438020299097238961/photo-gradient">Try the Figma Plugin</a>
    <span><a href="https://x.com/daniel__designs">Made by Daniel</a> © 2024</span>
  </footer>
</body>
</html>
